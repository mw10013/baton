# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# The staging Shopify app, served by the `staging` stage's Website Worker. Shopify CLI sends this
# file to Shopify with `shopify app deploy --config staging`; it never deploys the Workers, which
# Workers Builds does on every push to main. Deploy it again only when this file changes.
#
# web_directories must stay: Shopify CLI unions web_directories across EVERY shopify.app*.toml
# before it globs for shopify.web.toml, so this narrows discovery to the repo root and the Baton
# checkout under refs/ (via the refs symlink) is never scanned, which is what stops "You can only
# have one web configuration file with the backend role". It must NOT be copied into
# shopify.app.toml: the ACTIVE config's web_directories are re-matched with minimatch against
# "shopify.web.toml", "./shopify.web.toml" does not match, and the app silently loads zero webs.
# See refs/baton-legacy/docs/shopify-web-toml-conflict-research.md.
#
# Everything else mirrors shopify.app.toml (scopes, webhooks); keep the two in step. `handle` is the
# one Shopify assigned (read off the staging store's installed apps, 2026-10-18), pinned because
# billing builds the plan selection URL from it (`SHOPIFY_APP_HANDLE` in `.env.staging` must match).
# Never change it: it is the App Home's admin URL slug, and a new one breaks admin links.

client_id = "54b4c701f5c568d4cf4a11fd42d6fe7b"
name = "Baton Staging"
handle = "baton-staging"
application_url = "https://baton-website-staging.mw10013.workers.dev"
embedded = true
web_directories = ["."]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products"

[auth]
redirect_urls = ["https://baton-website-staging.mw10013.workers.dev/api/auth"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
uri = "/webhooks/compliance"
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/orders"
# `orders/updated` is not subscribed: it fires on every save of the order, for
# any reason, and every change Baton acts on already has its own topic here.
topics = ["orders/create", "orders/paid", "orders/cancelled", "orders/fulfilled"]
# `updated_at` is load-bearing, not informational: Shopify debounces consecutive
# identical trimmed payloads, so a subscription whose fields never change would
# silently drop updates.
include_fields = ["id", "admin_graphql_api_id", "updated_at"]

[[webhooks.subscriptions]]
uri = "/webhooks/orders"
# `orders/edited` carries an `order_edit` object: `order_id`, no `updated_at`,
# so the stale guard cannot apply and it always fetches. No `include_fields`:
# the payload differs per edit, so Shopify's identical-payload debounce is not
# a concern.
topics = ["orders/edited"]

[build]
automatically_update_urls_on_dev = false
